apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recipe-backend
  template:
    metadata:
      labels:
        app: recipe-backend
    spec:
      containers:
        - name: backend
          image: recipe-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: recipe-secrets
                  key: JWT_SECRET
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: recipe-config
                  key: PORT
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: application-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: application-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recipe-backend
spec:
  selector:
    app: recipe-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
