apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recipe-frontend
  template:
    metadata:
      labels:
        app: recipe-frontend
    spec:
      containers:
        - name: frontend
          image: recipe-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: recipe-frontend
spec:
  selector:
    app: recipe-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
